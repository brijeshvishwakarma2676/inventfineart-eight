<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Invent Fine Art | Sculptures, murals, FRP and GRC products</title>
    <meta name="description" content="Invent Fine Art makes sculptures, designer planters, murals, GRC products, GRC grilles and FRP products to your design, in our own factory near Mumbai." />
    <meta name="theme-color" content="#F1ECE3" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Invent Fine Art | Reinventing spaces through Innovations in Art" />
    <meta property="og:description" content="Sculptures, designer planters, murals, GRC and FRP products, made to your design in our own factory." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Opening loader: an arch drawn in one line, the bronze circle set into it, then the name.
         Inline so it paints before the app's JavaScript and CSS arrive. src/lib/loader.js lifts it away. */
      html.is-loading, html.is-loading body { overflow: hidden; }
      #loader {
        --ink: #262320; --bronze: #82532d; --brass: #b4925c; --ash: #645b4f;
        --loader-progress: 0.12;
        position: fixed; inset: 0; z-index: 200;
        display: grid; place-items: center;
        background: #f1ece3; color: var(--ink);
        transition: transform 1.05s cubic-bezier(0.65, 0, 0.35, 1);
      }
      #loader::after { /* the panel's lower edge, seen as it lifts */
        content: ''; position: absolute; inset: auto 0 0; height: 1px; background: var(--brass); opacity: 0.55;
      }
      #loader.is-leaving { transform: translateY(-100%); }
      .l-inner {
        display: flex; flex-direction: column; align-items: center;
        transition: opacity 0.45s ease, transform 1.05s cubic-bezier(0.65, 0, 0.35, 1);
      }
      #loader.is-leaving .l-inner { opacity: 0; transform: translateY(-8vh); }

      .l-mark { width: clamp(64px, 5.4vw, 84px); aspect-ratio: 28 / 33; height: auto; overflow: visible; }
      .l-ground, .l-arch { fill: none; stroke: var(--ink); stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .l-ground { stroke-width: 0.55; opacity: 0.35; animation: l-draw 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards; }
      .l-arch { stroke-width: 1.1; animation: l-draw 1.25s cubic-bezier(0.65, 0, 0.35, 1) 0.35s forwards; }
      .l-dot {
        fill: var(--bronze); opacity: 0; transform: translateY(-9px); transform-box: fill-box;
        animation: l-dot 0.8s cubic-bezier(0.22, 1, 0.36, 1) 1.45s forwards;
      }
      .l-word {
        margin-top: 1.6rem;
        font-family: Marcellus, 'Cormorant Garamond', Georgia, serif; font-size: clamp(1.65rem, 2.1vw, 2.15rem); letter-spacing: 0.02em; line-height: 1;
        clip-path: inset(0 100% 0 0); opacity: 0;
      }
      .l-sub {
        margin-top: 0.85rem;
        font-family: 'Albert Sans', ui-sans-serif, system-ui, sans-serif; font-size: 0.6875rem; font-weight: 500;
        letter-spacing: 0.2em; text-transform: uppercase; color: var(--ash); opacity: 0;
      }
      #loader.l-type .l-word { animation: l-word 1s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      #loader.l-type .l-sub { animation: l-fade 0.8s ease 0.35s forwards; }
      .l-line { position: relative; width: 9rem; height: 1px; margin-top: 2rem; background: rgba(38, 35, 32, 0.12); overflow: hidden; }
      .l-line span {
        position: absolute; inset: 0; background: var(--bronze);
        transform: scaleX(var(--loader-progress)); transform-origin: left;
        transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .l-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

      @keyframes l-draw { to { stroke-dashoffset: 0; } }
      @keyframes l-dot { to { opacity: 1; transform: translateY(0); } }
      @keyframes l-word { to { clip-path: inset(0 0 0 0); opacity: 1; } }
      @keyframes l-fade { to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .l-ground, .l-arch { animation: none; stroke-dashoffset: 0; }
        .l-dot { animation: none; opacity: 1; transform: none; }
        .l-word, .l-sub { animation: none !important; clip-path: none; opacity: 1; }
        #loader { transition: opacity 0.4s ease; }
        #loader.is-leaving { transform: none; opacity: 0; }
      }
    </style>
    <noscript><style>#loader { display: none; } html.is-loading, html.is-loading body { overflow: auto; }</style></noscript>
  </head>
  <body>
    <div id="loader" role="status">
      <div class="l-inner">
        <svg class="l-mark" viewBox="0 0 28 33" aria-hidden="true">
          <path class="l-ground" pathLength="1" d="M0 31.5H28" />
          <path class="l-arch" pathLength="1" d="M3 31.5V14a11 11 0 0 1 22 0v17.5" />
          <circle class="l-dot" cx="14" cy="21" r="4" />
        </svg>
        <p class="l-word" aria-hidden="true">Invent Fine Art</p>
        <p class="l-sub" aria-hidden="true">Sculpture · Planters · Murals · FRP &amp; GRC</p>
        <div class="l-line" aria-hidden="true"><span></span></div>
        <span class="l-sr">Loading Invent Fine Art</span>
      </div>
    </div>
    <script>
      (function () {
        var loader = document.getElementById('loader')
        loader.dataset.start = String(performance.now())
        // Set the name only once its typeface is in, and once the arch is mostly drawn, so it never swaps fonts mid-reveal.
        var typed = false
        function type() { if (!typed) { typed = true; loader.classList.add('l-type') } }
        var fonts = document.fonts && document.fonts.load ? document.fonts.load('1em Marcellus') : Promise.resolve()
        Promise.all([fonts, new Promise(function (r) { setTimeout(r, 1150) })]).then(type, type)
        setTimeout(type, 2400)
        // Safety net: if the app never starts, don't leave the visitor behind the loader.
        setTimeout(function () {
          if (!document.getElementById('loader') || loader.classList.contains('is-leaving')) return
          loader.classList.add('is-leaving')
          document.documentElement.classList.remove('is-loading')
          setTimeout(function () { loader.remove() }, 1200)
        }, 9000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
